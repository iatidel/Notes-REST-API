Transform: AWS::Serverless-2016-10-31
Resources:
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  CreateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: CreateNoteFunction
      CodeUri: lambda/create-note
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          NOTESTABLE_TABLE_NAME: !Ref NotesTable
          NOTESTABLE_TABLE_ARN: !GetAtt NotesTable.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable

  CreateNoteFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateNoteFunction}

  ListNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: ListNotesFunction
      CodeUri: lambda/list-notes
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          NOTESTABLE_TABLE_NAME: !Ref NotesTable
          NOTESTABLE_TABLE_ARN: !GetAtt NotesTable.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable

  ListNotesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${ListNotesFunction}

  DeleteNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: DeleteNoteFunction
      CodeUri: lambda/delete-note
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          NOTESTABLE_TABLE_NAME: !Ref NotesTable
          NOTESTABLE_TABLE_ARN: !GetAtt NotesTable.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable

  DeleteNoteFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${DeleteNoteFunction}

  UpdateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: UpdateNoteFunction
      CodeUri: lambda/update-note
      Handler: app.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          NOTESTABLE_TABLE_NAME: !Ref NotesTable
          NOTESTABLE_TABLE_ARN: !GetAtt NotesTable.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable

  UpdateNoteFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${UpdateNoteFunction}

  NotesApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - ${ResourceName} From Stack ${AWS::StackName}
        - ResourceName: NotesApi
      StageName: Prod
      DefinitionBody:
        openapi: '3.0'
        info: {}
        paths:
          /notes:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListNotesFunction.Arn}/invocations
              responses: {}
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateNoteFunction.Arn}/invocations
              responses: {}
          /notes/{id}:
            put:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateNoteFunction.Arn}/invocations
              responses: {}
            delete:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteNoteFunction.Arn}/invocations
              responses: {}
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Cors:
        MaxAge: 5
        AllowOrigin: '''*'''
        AllowHeaders: '''Content-Type'''
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''

  NotesWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-noteswebs-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  NotesWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NotesWebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${NotesWebsiteBucket.Arn}/*
